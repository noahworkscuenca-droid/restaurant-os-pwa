<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ticksy — Back Office</title>
<script src="../config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1217; --panel:#181D23; --panel2:#1E242B; --line:#262D35; --line2:#1C2227;
  --ink:#ECEFF2; --muted:#8B949E; --dim:#6E7781; --faint:#5C6670;
  --good:#35D07F; --good-bg:#16321F; --good-bd:#2C5B3C;
  --warn:#E8A23D; --bad:#FF6B5E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.hdr .brand{font-size:13px;letter-spacing:.04em;color:var(--dim)}
.hdr h1{font-size:20px;margin:3px 0 0;font-weight:600}
.hdr p{font-size:13px;color:var(--muted);margin:3px 0 0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);font-family:inherit}
.btn:hover{border-color:#3A434D}
.btn.primary{background:var(--good-bg);color:var(--good);border-color:var(--good-bd)}
.btn.primary:hover{opacity:.9}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;width:100%;background:var(--panel2);color:var(--ink)}
input::placeholder{color:var(--faint)}
label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px}
.field{margin-bottom:12px}

/* login */
#loginWrap{max-width:360px;margin:14vh auto;padding:0 20px}
#loginWrap .card{padding:26px 24px}
#loginWrap .brand{font-size:12px}
#loginWrap h1{font-size:18px;margin:4px 0 4px;font-weight:600}
#loginWrap p{font-size:13px;color:var(--muted);margin:0 0 20px}
#loginErr{color:var(--bad);font-size:13px;margin-top:10px;display:none}

/* ticket-strip kpis */
.kpis{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow-x:auto}
.kpis::before,.kpis::after{content:"";position:absolute;top:36px;width:16px;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:50%}
.kpis::before{left:-9px}.kpis::after{right:-9px}
.kpirow{display:flex}
.kpi{flex:1 0 128px;padding:16px 18px;border-right:1px dashed var(--line)}
.kpi:last-child{border-right:none}
.kpi .n{font-size:24px;font-weight:600;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.3}

.alert{background:#2E1C17;border:1px solid #5A3226;border-radius:12px;padding:12px 16px;font-size:13px;color:#FFB199;margin-bottom:18px}

.section-label{font-size:13px;color:var(--dim);margin:4px 2px 12px}

/* ticket cards (replace table) */
.content-row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.list{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ticket{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.ticket::before,.ticket::after{content:"";position:absolute;top:50px;width:16px;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:50%}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket:hover{border-color:#3A434D}
.ticket.selected{border-color:var(--good-bd)}
.ticket .top{padding:15px 18px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.biz-name{font-weight:600;font-size:15px}
.status{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-prueba{background:var(--warn)} .status.prueba{color:var(--warn)}
.dot-activo{background:var(--good)} .status.activo{color:var(--good)}
.dot-vencido{background:var(--bad)} .status.vencido{color:var(--bad)}
.date-col{text-align:right;flex:none}
.date-col .l{font-size:11px;color:var(--dim)}
.date-col .v{font-size:13px;color:#C7CCD1;margin-top:2px}
.tear{border-top:1px dashed #30383F;margin:0 18px}
.ticket .bottom{padding:13px 18px;display:flex;align-items:center;justify-content:space-between}
.stat-pair{display:flex;gap:22px}
.stat-pair .n{font-size:14px;font-weight:600}
.stat-pair .l{font-size:11px;color:var(--dim);margin-top:2px}
.vis-wrap{display:flex;align-items:center;gap:8px}
.vis-wrap .l{font-size:11px;color:var(--dim)}

.toggle{position:relative;width:38px;height:22px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;flex:none;padding:0}
.toggle.on{background:var(--good-bg);border-color:var(--good-bd)}
.toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#5A6472;transition:left .15s ease}
.toggle.on .knob{left:18px;background:var(--good)}

/* drawer */
.drawer{width:320px;flex:1 1 300px;max-width:400px;padding:0}
.drawer-head{padding:18px 20px 0}
.drawer-head .top{display:flex;justify-content:space-between;align-items:flex-start}
.drawer h3{margin:0;font-size:17px;font-weight:600}
.drawer .muted{font-size:12px;color:var(--dim);margin-top:3px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2);margin:16px 20px 0;border-radius:10px;overflow:hidden}
.stat-grid .cell{background:var(--panel);padding:13px 14px}
.stat-grid .cell .n{font-size:16px;font-weight:600}
.stat-grid .cell .l{font-size:11px;color:var(--dim);margin-top:3px}
.drawer-body{padding:0 20px 20px}
.mail-chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11.5px;margin:3px 5px 0 0}
.empty{font-size:13px;color:var(--muted);padding:24px 0;text-align:center}
.foot{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.5}
#app{display:none}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="card">
    <div class="brand mono">TICKSY</div>
    <h1>Back office</h1>
    <p>Acceso solo para administración de Divende.</p>
    <div class="field"><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="email"></div>
    <div class="field"><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="btnLogin" style="width:100%">Entrar</button>
    <div id="loginErr"></div>
  </div>
</div>

<div id="app">
<div class="wrap">
  <div class="hdr">
    <div>
      <div class="brand mono">TICKSY</div>
      <h1>Back office</h1>
      <p>Panel interno, aparte de la app que usan los restaurantes.</p>
    </div>
    <button class="btn" id="btnLogout">Salir</button>
  </div>

  <div id="alertBox"></div>

  <div class="kpis"><div class="kpirow" id="kpiBox"></div></div>

  <div class="section-label" id="countLabel"></div>

  <div class="content-row">
    <div class="list" id="tableBox"><div class="empty">Cargando…</div></div>
    <div class="card drawer" id="drawer" style="display:none"></div>
  </div>

  <div class="foot">"Visible" deja que ese restaurante vea su propio estado de suscripción dentro de Ticksy. Tocá una tarjeta para ver el detalle.</div>
</div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let sb=null, ROWS=[], SELECTED=null, TEAM_CACHE={};

function initSb(){
  if(sb) return sb;
  const c=window.ROS_CONFIG;
  if(!c||!c.SUPABASE_URL||!c.SUPABASE_KEY) return null;
  sb=supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY);
  return sb;
}
async function rpc(fn,args){
  if(!sb&&!initSb()) return {ok:false,error:'sin_conexion'};
  const {data,error}=await sb.rpc(fn,args||{});
  if(error) return {ok:false,error:error.message};
  return data;
}

function showApp(on){
  $('loginWrap').style.display=on?'none':'block';
  $('app').style.display=on?'block':'none';
}

$('btnLogin').onclick=async()=>{
  if(!initSb()){$('loginErr').textContent='No se pudo conectar.';$('loginErr').style.display='block';return;}
  const email=$('lEmail').value.trim(), pass=$('lPass').value;
  if(!email||!pass){return;}
  $('btnLogin').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('btnLogin').disabled=false;
  if(error){$('loginErr').textContent='Correo o contraseña incorrectos.';$('loginErr').style.display='block';return;}
  await boot();
};
$('btnLogout').onclick=async()=>{await sb.auth.signOut();location.reload();};

async function boot(){
  const r=await rpc('api_super_list_restaurants',{});
  if(!r||!r.ok){
    $('loginErr').textContent='Esta cuenta no tiene acceso al Back Office.';
    $('loginErr').style.display='block';
    await sb.auth.signOut();
    showApp(false);
    return;
  }
  ROWS=r.rows||[];
  showApp(true);
  render();
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){ return d? new Date(d).toLocaleDateString('es-CR',{day:'numeric',month:'short',year:'numeric'}) : '—'; }
function fmtDateTime(d){ return d? new Date(d).toLocaleString('es-CR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'Sin actividad'; }

const PILL_TXT={prueba:'En prueba',activo:'Activo',vencido:'Vencido'};

function render(){
  const activos=ROWS.filter(b=>b.plan_status==='activo').length;
  const prueba=ROWS.filter(b=>b.plan_status==='prueba').length;
  const vencidos=ROWS.filter(b=>b.plan_status==='vencido').length;
  const correos=ROWS.reduce((s,b)=>s+Number(b.cuentas||0),0);
  const facturasMes=ROWS.reduce((s,b)=>s+Number(b.facturas_mes||0),0);

  $('kpiBox').innerHTML=[
    ['Negocios activos',activos],['En prueba',prueba],['Vencidos',vencidos],
    ['Correos registrados',correos],['Facturas este mes',facturasMes]
  ].map(([l,n])=>'<div class="kpi"><div class="n mono">'+n+'</div><div class="l">'+l+'</div></div>').join('');

  $('countLabel').textContent = ROWS.length + (ROWS.length===1?' negocio':' negocios') + ' · ordenados por próximo vencimiento';

  const needsAttention=ROWS.filter(b=>b.plan_status==='vencido'||
    (b.plan_status==='prueba'&&b.trial_ends_at&&(new Date(b.trial_ends_at)-Date.now())<3*86400000));
  $('alertBox').innerHTML=needsAttention.length
    ? '<div class="alert">⚠ '+needsAttention.length+' negocio(s) necesitan atención: pagos vencidos o prueba por terminar.</div>'
    : '';

  $('tableBox').innerHTML = ROWS.length ? ROWS.map(b=>(
    '<div class="ticket'+(SELECTED===b.id?' selected':'')+'" data-id="'+b.id+'">'+
      '<div class="top">'+
        '<div>'+
          '<div class="biz-name">'+esc(b.nombre)+'</div>'+
          '<div class="status '+b.plan_status+'"><span class="dot dot-'+b.plan_status+'"></span>'+PILL_TXT[b.plan_status]+'</div>'+
        '</div>'+
        '<div class="date-col"><div class="l">prueba / cobro</div><div class="v mono">'+fmtDate(b.trial_ends_at)+'</div></div>'+
      '</div>'+
      '<div class="tear"></div>'+
      '<div class="bottom">'+
        '<div class="stat-pair">'+
          '<div><div class="n mono">'+b.cuentas+'</div><div class="l">cuentas</div></div>'+
          '<div><div class="n mono">'+b.facturas_mes+'</div><div class="l">facturas/mes</div></div>'+
        '</div>'+
        '<div class="vis-wrap"><span class="l">visible</span><button class="toggle'+(b.owner_visible?' on':'')+'" data-vis="'+b.id+'"><span class="knob"></span></button></div>'+
      '</div>'+
    '</div>'
  )).join('') : '<div class="card empty">Todavía no hay negocios.</div>';

  document.querySelectorAll('.ticket[data-id]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target.closest('[data-vis]')) return; selectRow(el.dataset.id); };
  });
  document.querySelectorAll('[data-vis]').forEach(el=>{
    el.onclick=async(e)=>{
      e.stopPropagation();
      const id=el.dataset.vis, row=ROWS.find(b=>b.id===id);
      const r=await rpc('api_super_set_owner_visible',{p_restaurant_id:id,p_visible:!row.owner_visible});
      if(r&&r.ok){ row.owner_visible=!row.owner_visible; render(); if(SELECTED===id) renderDrawer(); }
    };
  });

  if(SELECTED) renderDrawer();
}

async function selectRow(id){
  SELECTED = SELECTED===id ? null : id;
  render();
}

async function renderDrawer(){
  const d=$('drawer');
  const row=ROWS.find(b=>b.id===SELECTED);
  if(!row){d.style.display='none';return;}
  d.style.display='block';
  d.innerHTML =
    '<div class="drawer-head">'+
      '<div class="top">'+
        '<div>'+
          '<div class="brand mono" style="font-size:11px">TICKSY · NEGOCIO</div>'+
          '<h3>'+esc(row.nombre)+'</h3>'+
          '<div class="status '+row.plan_status+'" style="margin-top:8px"><span class="dot dot-'+row.plan_status+'"></span>'+PILL_TXT[row.plan_status]+' · vence '+fmtDate(row.trial_ends_at)+'</div>'+
        '</div>'+
        '<button class="btn" id="drawerClose" style="padding:3px 9px">✕</button>'+
      '</div>'+
      '<div class="muted">Creado '+fmtDate(row.created_at)+'</div>'+
    '</div>'+
    '<div class="stat-grid">'+
      '<div class="cell"><div class="n mono">'+row.cuentas+'</div><div class="l">cuentas</div></div>'+
      '<div class="cell"><div class="n mono">'+row.facturas_mes+'</div><div class="l">facturas / mes</div></div>'+
      '<div class="cell" style="grid-column:1 / -1"><div class="n mono" style="font-size:13px">'+fmtDateTime(row.ultima_actividad)+'</div><div class="l">última actividad</div></div>'+
    '</div>'+
    '<div class="drawer-body">'+
      '<div style="margin-top:16px"><button class="btn" id="btnShowEmails" style="width:100%">Ver correos ('+row.cuentas+')</button></div>'+
      '<div id="emailsBox" style="margin-top:8px"></div>'+
      '<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">'+
        '<button class="btn primary" id="btnMarkPaid">Marcar pagado</button>'+
        '<button class="btn" data-setstatus="vencido">Marcar vencido</button>'+
        '<button class="btn" data-setstatus="prueba">Volver a prueba</button>'+
      '</div>'+
    '</div>';

  $('drawerClose').onclick=()=>{SELECTED=null;render();};
  $('btnMarkPaid').onclick=async()=>{
    const dias=prompt('¿Cuántos días de suscripción activa agregar desde hoy?','30');
    if(dias===null) return;
    const n=parseInt(dias,10); if(!n||n<=0) return;
    const nueva=new Date(Date.now()+n*86400000).toISOString();
    const r=await rpc('api_super_set_plan',{p_restaurant_id:row.id,p_status:'activo',p_trial_ends_at:nueva});
    if(r&&r.ok){ await boot(); renderDrawer(); } else alert('No se pudo actualizar.');
  };
  $('btnShowEmails').onclick=async()=>{
    const box=$('emailsBox');
    if(box.dataset.open==='1'){box.innerHTML='';box.dataset.open='0';return;}
    box.innerHTML='<span class="muted">Cargando…</span>';
    const r=TEAM_CACHE[row.id] || await rpc('api_super_list_team',{p_restaurant_id:row.id});
    TEAM_CACHE[row.id]=r;
    if(r&&r.ok){
      box.innerHTML=(r.rows||[]).map(u=>'<span class="mail-chip">'+esc(u.email)+' · '+u.role+'</span>').join('')||'<span class="muted">Sin cuentas.</span>';
      box.dataset.open='1';
    }
  };
  d.querySelectorAll('[data-setstatus]').forEach(btn=>{
    btn.onclick=async()=>{
      const r=await rpc('api_super_set_plan',{p_restaurant_id:row.id,p_status:btn.dataset.setstatus});
      if(r&&r.ok) await boot();
    };
  });
}

(async function start(){
  if(!initSb()) return;
  const {data}=await sb.auth.getSession();
  if(data&&data.session){ await boot(); }
})();
</script>
</body>
</html>
